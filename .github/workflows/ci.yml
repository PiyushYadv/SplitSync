name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A newer push to the same branch or PR cancels the run it supersedes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      # Unit tests plus Testcontainers integration tests (Postgres and Redis run in Docker on the runner).
      - run: ./mvnw -B -ntp verify
        env:
          # Shared runners hit Docker Hub's anonymous pull limit; pull the same official images from
          # Amazon's public mirror instead. Ryuk (container cleanup) isn't mirrored, and runners are
          # discarded after the job anyway.
          TESTCONTAINERS_HUB_IMAGE_NAME_PREFIX: public.ecr.aws/docker/library/
          TESTCONTAINERS_RYUK_DISABLED: 'true'

  backend-image:
    name: Backend Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      # Builds what Render deploys, including the Class Data Sharing training run; nothing is pushed.
      - run: docker build --tag splitsync-api:ci backend

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
