name: Keep backend warm

# Render's free instances sleep after 15 minutes without traffic and take about a minute to wake.
# Pinging every 10 minutes keeps the demo responsive (one service running all month fits in Render's
# 750 free instance hours). Set the BACKEND_URL repository variable, e.g. https://splitsync-api.onrender.com,
# to enable it. GitHub may delay scheduled runs, and pauses them after 60 days without repository activity.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    if: vars.BACKEND_URL != ''
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: curl --fail --silent --show-error --max-time 120 --retry 2 "${{ vars.BACKEND_URL }}/api/config"
