server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: splitsync-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/splitsync}
    username: ${SPRING_DATASOURCE_USERNAME:splitsync}
    password: ${SPRING_DATASOURCE_PASSWORD:splitsync_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: SplitSyncHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Load lazy associations (payer, splits, members) in batches instead of one query per row.
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  session:
    redis:
      repository-type: indexed
      namespace: spring:session
      flush-mode: on_save
      cleanup-cron: "0 * * * * *"
    timeout: 7d

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  session:
    cookie-name: splitsync_session
    cookie-same-site: Lax
    cookie-secure: false
  fx:
    cache-ttl-hours: 6
    base-url: ${APP_FX_BASE_URL:https://api.frankfurter.dev/v1}
