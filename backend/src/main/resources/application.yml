server:
  # Hosts like Render set PORT.
  port: ${PORT:8080}
  servlet:
    context-path: /api

spring:
  application:
    name: splitsync-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/splitsync}
    username: ${SPRING_DATASOURCE_USERNAME:splitsync}
    password: ${SPRING_DATASOURCE_PASSWORD:splitsync_secret}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 30000
      pool-name: SplitSyncHikariCP

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: false
        dialect: org.hibernate.dialect.PostgreSQLDialect
        # Load lazy associations (payer, splits, members) in batches instead of one query per row.
        default_batch_fetch_size: 100

  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

  cache:
    type: redis

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST:localhost}
      port: ${SPRING_DATA_REDIS_PORT:6379}
      timeout: 2000ms

  session:
    redis:
      repository-type: indexed
      namespace: spring:session
      flush-mode: on_save
      cleanup-cron: "0 * * * * *"
    timeout: 7d

  mail:
    # Mailpit from docker-compose in development; point these at a real SMTP server in production.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      # Off for Mailpit; on for real SMTP providers such as Brevo.
      mail.smtp.auth: ${SPRING_MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SPRING_MAIL_SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 10000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  jackson:
    property-naming-strategy: LOWER_CAMEL_CASE
    serialization:
      write-dates-as-timestamps: false
    default-property-inclusion: non_null

app:
  # Where links in emails and OAuth redirects send the browser.
  frontend-url: ${APP_FRONTEND_URL:http://localhost:3000}
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000}
  session:
    cookie-name: splitsync_session
    cookie-same-site: Lax
    # true in production (HTTPS only).
    cookie-secure: ${APP_SESSION_COOKIE_SECURE:false}
    # Spring Session enables Redis keyspace notifications with CONFIG SET at startup. Set to false for managed
    # Redis that rejects CONFIG, after enabling notify-keyspace-events "Egx" in the provider's console.
    configure-redis: ${APP_SESSION_CONFIGURE_REDIS:true}
  fx:
    cache-ttl-hours: 6
    base-url: ${APP_FX_BASE_URL:https://api.frankfurter.dev/v1}
  mail:
    from: ${APP_MAIL_FROM:SplitSync <no-reply@splitsync.local>}
  # Leave a provider's id/secret empty to hide its sign-in button.
  oauth:
    # Base of the provider callback URL (<base>/auth/oauth/callback/<provider>). By default it's this server's
    # own URL; behind a proxy that serves /api on another host (e.g. Vercel), set it to that public URL.
    redirect-base-url: ${APP_OAUTH_REDIRECT_BASE_URL:{baseUrl}}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
    github:
      client-id: ${GITHUB_CLIENT_ID:}
      client-secret: ${GITHUB_CLIENT_SECRET:}
  # Leave the key empty to hide receipt scanning.
  ocr:
    gemini:
      api-key: ${GEMINI_API_KEY:}
      model: ${GEMINI_MODEL:gemini-3.5-flash-lite}
      base-url: https://generativelanguage.googleapis.com/v1beta
  rate-limit:
    enabled: true
    # Keyed by client IP (login/signup) or by user (search).
    login:
      capacity: 10
      refill-per-minute: 10
    signup:
      capacity: 5
      refill-per-minute: 1
    user-search:
      capacity: 30
      refill-per-minute: 30
    # Password reset, verification and email change messages (per IP or per user).
    email:
      capacity: 5
      refill-per-minute: 1
    receipt-scan:
      capacity: 10
      refill-per-minute: 5
