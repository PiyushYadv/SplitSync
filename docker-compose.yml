services:
  postgres:
    image: postgres:16-alpine
    container_name: splitsync-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: splitsync
      POSTGRES_USER: splitsync
      POSTGRES_PASSWORD: splitsync_secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U splitsync -d splitsync"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: splitsync-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    name: splitsync_postgres_data
  redis_data:
    name: splitsync_redis_data
